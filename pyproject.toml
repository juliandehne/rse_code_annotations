[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rse-code-annotations"
version = "0.3.0"
description = "Concern decorators for generated research code, with a static analysis and a human inspection runner."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Julian Dehne" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rse-annotations = "rse_annotations.__main__:main"

[tool.setuptools.packages.find]
include = ["rse_annotations*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
