[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rse-code-annotations"
version = "0.1.0"
description = "Role annotations for generated code, with a checking runner and optional Fable-assisted test stubs."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Julian Dehne" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
fable = ["anthropic>=0.40"]
dev = ["pytest>=7", "anthropic>=0.40"]

[project.scripts]
rse-annotations = "rse_annotations.cli:main"

[tool.setuptools]
packages = ["rse_annotations"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
