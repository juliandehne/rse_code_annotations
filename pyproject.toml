[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rse-code-annotations"
version = "0.2.0"
description = "Role annotations for generated code, with a checking runner, formula inference, and pattern-based test-stub generation."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Julian Dehne" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
formula = ["sympy>=1.12", "latexify-py>=0.4"]
dev = ["pytest>=7", "sympy>=1.12", "latexify-py>=0.4"]

[project.scripts]
rse-annotations = "rse_annotations.cli:main"

[tool.setuptools.packages.find]
include = ["rse_annotations*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
